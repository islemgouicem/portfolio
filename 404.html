<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>NeuroDesign Studio Portfolio</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 1;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
    <div style="
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: Inter, sans-serif; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #334155;
    ">
        <div style="text-align: center;">
            <div style="
          width: 60px; 
          height: 60px; 
          margin: 0 auto 20px; 
          background: linear-gradient(135deg, #8b5cf6, #14b8a6); 
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
        ">
                <div style="color: white; font-size: 24px;">🚀</div>
            </div>
            <h1 style="margin: 0 0 10px; font-size: 24px; font-weight: 600;">Redirecting...</h1>
            <p style="margin: 0; opacity: 0.7;">Taking you to NeuroDesign Studio</p>
        </div>
    </div>
</body>

</html>
